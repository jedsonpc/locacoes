<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Login | Cupe Beach Living</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 14px;
        background:
          linear-gradient(90deg, rgba(15, 23, 42, .82), rgba(15, 118, 110, .34)),
          url("cupe-login-recorte-real.jpg") center / cover no-repeat;
        color: #0f172a;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .login-shell {
        width: min(390px, 100%);
        max-height: calc(100dvh - 28px);
        overflow: hidden;
        background: rgba(255, 255, 255, .94);
        border: 1px solid rgba(255, 255, 255, .72);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, .26);
        padding: 20px;
        backdrop-filter: blur(12px);
      }
      .brand {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .brand img.login-brand-logo {
        width: min(280px, 100%);
        height: auto;
        border-radius: 8px;
        box-shadow: none;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      .brand span, .hint {
        color: #64748b;
        font-size: 13px;
      }
      label {
        display: block;
        margin: 10px 0 5px;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
      }
      input {
        width: 100%;
        height: 40px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0 12px;
        color: #0f172a;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #0f766e;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
      }
      .password-row {
        position: relative;
      }
      .password-row input {
        padding-right: 92px;
      }
      .password-toggle {
        position: absolute;
        right: 6px;
        top: 6px;
        width: auto;
        height: 32px;
        margin: 0;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #f8fafc;
        color: #0f766e;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 800;
      }
      button {
        width: 100%;
        height: 42px;
        margin-top: 14px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        cursor: pointer;
        font-weight: 800;
      }
      button:disabled {
        cursor: wait;
        opacity: .65;
      }
      .install-button {
        display: none;
        margin-top: 8px;
        border: 1px solid #0f766e;
        background: #ecfdf5;
        color: #0f766e;
      }
      .install-button.visible {
        display: block;
      }
      .link-button { margin-top: 8px; background: transparent; color: #0f766e; }
      .hidden { display: none !important; }
      .status {
        display: none;
        margin-top: 14px;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fef2f2;
        color: #991b1b;
        font-size: 13px;
        line-height: 1.4;
      }
      .status.info {
        background: #ecfeff;
        color: #155e75;
      }
      .hint {
        margin: 10px 0 0;
        line-height: 1.35;
      }
      @media (max-height: 650px) {
        .brand img.login-brand-logo { width: min(220px, 100%); }
        .brand { margin-bottom: 10px; }
        h1 { font-size: 19px; }
        .hint { display: none; }
      }
      @media (max-width: 760px) {
        body {
          place-items: center;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <form class="login-shell" id="loginForm">
      <div class="brand">
        <img class="login-brand-logo" src="logo-cupe-beach-living.png" alt="Cupe Beach Living - Gestao de Locacao" />
        <div>
          <h1>Cupe Beach Living</h1>
          <span>Gestao de locacao</span>
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Senha</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="togglePassword" class="password-toggle" type="button">Exibir</button>
      </div>
      <button id="forgotPassword" class="link-button" type="button">Esqueci minha senha</button>
      <button id="submitBtn" type="submit">Entrar no app</button>
      <button id="installBtn" class="install-button" type="button">
        Instalar aplicativo no celular
      </button>
      <div class="status" id="status"></div>
      <p class="hint">Use somente usuarios cadastrados e autorizados no projeto Supabase gestao-locacoes.</p>
    </form>
    <form class="login-shell hidden" id="recoveryForm">
      <div class="brand"><div><h1 id="recoveryTitle">Redefinir senha</h1><span id="recoverySubtitle">Informe e confirme sua nova senha.</span></div></div>
      <div id="recoveryEmailFields" class="hidden"><label for="recoveryEmail">E-mail cadastrado</label><input id="recoveryEmail" type="email" autocomplete="email" /></div>
      <div id="recoveryPasswordFields"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" /><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" /></div>
      <button id="recoverySubmit" type="submit">Salvar nova senha</button>
      <button id="backToLogin" class="link-button" type="button">Voltar ao login</button>
      <div class="status" id="recoveryStatus"></div>
    </form>

    <script src="login-update.js?v=20260731" data-app-name="Cupe Beach Living"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=2.1.51-auto-20260901-2056"></script>
    <script src="supabase-sync.js?v=2.1.51-auto-20260901-2056"></script>
    <script>
      const offlineUserKey = "app-locacao-last-online-user-v1";
      let deferredInstallPrompt = null;
      const recoveryFromLink = /type=(recovery|invite)/.test(location.hash + location.search);

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        document.getElementById("installBtn")?.classList.add("visible");
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        document.getElementById("installBtn")?.classList.remove("visible");
      });

      document.getElementById("installBtn").addEventListener("click", async () => {
        if (!deferredInstallPrompt) return;
        await deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        document.getElementById("installBtn").classList.remove("visible");
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .catch(() => undefined),
        );
      }

      function setStatus(text, kind = "error") {
        const el = document.getElementById("status");
        el.textContent = text;
        el.className = kind === "info" ? "status info" : "status";
        el.style.display = "block";
      }

      function cacheUser(user) {
        if (!user?.id && !user?.email) return;
        localStorage.setItem(offlineUserKey, JSON.stringify({
          id: user.id || user.email,
          email: user.email || "",
          name: user.user_metadata?.name || user.user_metadata?.full_name || "",
          role: user.app_metadata?.app_access?.locacao?.role || user.app_metadata?.role || user.user_metadata?.role || "consulta",
          cachedAt: new Date().toISOString()
        }));
      }

      function getCachedUser() {
        try {
          return JSON.parse(localStorage.getItem(offlineUserKey));
        } catch {
          return null;
        }
      }

      async function boot() {
        const button = document.getElementById("submitBtn");
        button.disabled = true;
        if (!window.LocacoesSupabaseSync) {
          const cached = getCachedUser();
          if (!navigator.onLine && cached) {
            setStatus("Modo offline disponivel para o ultimo usuario validado neste computador.", "info");
            button.disabled = false;
            return;
          }
          setStatus("Nao foi possivel carregar o Supabase. Verifique a internet e recarregue.");
          return;
        }
        window.LocacoesSupabaseSync.configure();
        if (recoveryFromLink) {
          document.getElementById("loginForm").classList.add("hidden");
          document.getElementById("recoveryForm").classList.remove("hidden");
          document.getElementById("recoveryTitle").textContent = /type=invite/.test(location.hash + location.search) ? "Ativar seu acesso" : "Redefinir senha";
        }
        try {
          await window.LocacoesSupabaseSync.restoreSession();
          const user = window.LocacoesSupabaseSync.getUser();
          if (recoveryFromLink) return;
          if (user) {
            cacheUser(user);
            location.replace("index.html");
            return;
          }
        } catch {
          if (!recoveryFromLink) setStatus("Informe e-mail e senha para iniciar uma sessao segura.", "info");
        } finally {
          button.disabled = false;
        }
      }

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("submitBtn");
        button.disabled = true;
        button.textContent = "Validando...";
        try {
          if (!window.LocacoesSupabaseSync) throw new Error("Modulo Supabase nao carregado.");
          const user = await window.LocacoesSupabaseSync.signIn(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );
          cacheUser(user);
          location.replace("index.html");
        } catch (error) {
          setStatus("Falha no login: " + (error.message || error));
          button.disabled = false;
          button.textContent = "Entrar no app";
        }
      });

      document.getElementById("togglePassword").addEventListener("click", () => {
        const password = document.getElementById("password");
        const visible = password.type === "text";
        password.type = visible ? "password" : "text";
        document.getElementById("togglePassword").textContent = visible ? "Exibir" : "Ocultar";
      });

      document.getElementById("forgotPassword").addEventListener("click", () => {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("recoveryForm").classList.remove("hidden");
        document.getElementById("recoveryTitle").textContent = "Recuperar senha";
        document.getElementById("recoverySubtitle").textContent = "Enviaremos um link seguro para o e-mail cadastrado.";
        document.getElementById("recoveryEmailFields").classList.remove("hidden");
        document.getElementById("recoveryPasswordFields").classList.add("hidden");
        document.getElementById("recoveryEmail").value = document.getElementById("email").value;
        document.getElementById("recoverySubmit").textContent = "Enviar link";
      });

      document.getElementById("backToLogin").addEventListener("click", () => location.replace("login.html"));
      document.getElementById("recoveryForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = document.getElementById("recoveryStatus");
        const button = document.getElementById("recoverySubmit");
        button.disabled = true;
        try {
          if (!window.LocacoesSupabaseSync) throw new Error("Modulo Supabase nao carregado.");
          if (!document.getElementById("recoveryEmailFields").classList.contains("hidden")) {
            const email = document.getElementById("recoveryEmail").value.trim();
            if (!email) throw new Error("Informe o e-mail cadastrado.");
            await window.LocacoesSupabaseSync.requestPasswordReset(email, new URL("login.html?type=recovery", location.href).href);
            status.textContent = "Se o e-mail estiver cadastrado, o link foi enviado. Verifique também a pasta de spam.";
            status.className = "status info";
          } else {
            const password = document.getElementById("newPassword").value;
            if (password.length < 8) throw new Error("A senha deve ter pelo menos 8 caracteres.");
            if (password !== document.getElementById("confirmPassword").value) throw new Error("As senhas não coincidem.");
            await window.LocacoesSupabaseSync.updatePassword(password);
            location.replace("index.html");
          }
        } catch (error) {
          status.textContent = "Não foi possível concluir: " + (error.message || error);
          status.className = "status";
        } finally {
          status.style.display = "block";
          button.disabled = false;
        }
      });

      boot();
    </script>
  </body>
</html>
